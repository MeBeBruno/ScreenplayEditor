<!DOCTYPE html>
<html lang='de' data-theme='system'>
<head>
	<meta charset='UTF-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1.0'>
	<title>ScriptBridge</title>
	<link rel='stylesheet' href='./styles/design-tokens.css'>
	<link rel='stylesheet' href='./styles/workspace-layout.css'>
</head>
<body>
	<a class='skip-link' href='#main-content'>Zum Inhalt springen</a>

	<header class='top-bar' role='banner'>
		<div class='top-bar-left'>
			<button type='button' id='back-to-dashboard-button' class='ghost-button is-hidden' aria-label='Zurück zur Übersicht'>
				← Alle Dokumente
			</button>
			<span id='brand-title-element' class='brand-title'>Drehbücher</span>
			<span id='save-timestamp-indicator' class='save-indicator is-hidden' role='status' aria-live='polite'></span>
		</div>

		<div class='top-bar-right'>
			<div id='editor-actions-container' class='editor-actions is-hidden'>
				<button type='button' id='open-ai-import-button' class='secondary-button'>
					✨ KI-Szene einfügen
				</button>

				<div class='split-button-group'>
					<button type='button' id='export-overleaf-button' class='primary-button split-main-button'>
						Als PDF in Overleaf öffnen ↗
					</button>
					<button type='button' id='toggle-export-menu-button' class='primary-button split-trigger-button' aria-haspopup='true' aria-expanded='false' aria-label='Weitere Export-Optionen'>
						▾
					</button>
					<div id='export-dropdown-menu' class='dropdown-menu is-hidden' role='menu'>
						<button type='button' id='copy-latex-source-button' class='dropdown-item' role='menuitem'>
							LaTeX-Code in Zwischenablage kopieren
						</button>
						<button type='button' id='download-tex-file-button' class='dropdown-item' role='menuitem'>
							Als .tex-Datei herunterladen
						</button>
					</div>
				</div>
			</div>

			<button type='button' id='theme-toggle-button' class='icon-button' aria-label='Erscheinungsbild wechseln' title='Hell / Dunkel wechseln'>
				◐
			</button>
		</div>
	</header>

	<main id='main-content' class='workspace-container' tabindex='-1'>
		<section id='dashboard-section' class='dashboard-section' aria-label='Dokumentenübersicht'>
			<div class='dashboard-toolbar'>
				<div class='search-box'>
					<input type='search' id='search-documents-input' class='clean-input search-input' placeholder='Suchen...' aria-label='Drehbücher durchsuchen'>
				</div>

				<div class='sort-controls'>
					<label for='sort-criterion-select' class='sort-label'>Sortierung:</label>
					<select id='sort-criterion-select' class='clean-select'>
						<option value='modificationTimestamp'>Zuletzt bearbeitet</option>
						<option value='creationTimestamp'>Erstellungsdatum</option>
						<option value='title'>Name</option>
					</select>
					<button type='button' id='sort-direction-button' class='secondary-button sort-direction-button' aria-label='Sortierreihenfolge umkehren' title='Absteigend / Aufsteigend umschalten'>
						↓ Absteigend
					</button>

					<div class='relative-menu-wrapper'>
						<button type='button' id='toggle-backup-menu-button' class='icon-button' aria-haspopup='true' aria-expanded='false' aria-label='Datensicherung' title='Datensicherung'>
							⋯
						</button>
						<div id='backup-dropdown-menu' class='dropdown-menu is-hidden' role='menu'>
							<button type='button' id='export-json-backup-button' class='dropdown-item' role='menuitem'>
								Alle Dokumente als Backup sichern (.json)
							</button>
							<label for='import-json-backup-input' class='dropdown-item file-label-item' role='menuitem' tabindex='0'>
								Backup-Datei wiederherstellen (.json)
							</label>
							<input type='file' id='import-json-backup-input' class='visually-hidden' accept='application/json'>
						</div>
					</div>
				</div>
			</div>

			<div id='documents-grid' class='documents-grid' role='list'></div>
		</section>

		<section id='editor-section' class='editor-section is-hidden' aria-label='Drehbuch-Editor'>
			<div class='manuscript-paper'>
				<header class='manuscript-header'>
					<input type='text' id='document-title-input' class='manuscript-title-input' placeholder='Titel des Drehbuchs' aria-label='Titel des Drehbuchs'>
					<div class='manuscript-author-row'>
						<span class='author-prefix'>von</span>
						<input type='text' id='document-author-input' class='manuscript-author-input' placeholder='Name des Autors' aria-label='Name des Autors'>
						<button type='button' id='toggle-cover-options-button' class='subtle-text-button' aria-expanded='false' aria-controls='cover-options-drawer'>
							Deckblatt &amp; Optionen ▾
						</button>
					</div>

					<div id='cover-options-drawer' class='cover-options-drawer is-hidden'>
						<div class='cover-option-field'>
							<label for='document-address-input' class='subtle-label'>Kontakt / Fassung (unten links auf dem Deckblatt)</label>
							<input type='text' id='document-address-input' class='clean-input' placeholder='z. B. Entwurf 1.0 — kontakt@studio.de'>
						</div>
						<div class='cover-checkbox-grid'>
							<label class='clean-checkbox'>
								<input type='checkbox' id='option-title-page-checkbox'>
								<span> Eigenes Deckblatt voranstellen</span>
							</label>
							<label class='clean-checkbox'>
								<input type='checkbox' id='option-fade-in-checkbox'>
								<span> Mit „FADE IN:“ beginnen</span>
							</label>
							<label class='clean-checkbox'>
								<input type='checkbox' id='option-fade-out-checkbox'>
								<span> Mit „FADE OUT.“ abschließen</span>
							</label>
							<label class='clean-checkbox'>
								<input type='checkbox' id='option-the-end-checkbox'>
								<span> „THE END“ am Ende setzen</span>
							</label>
						</div>
					</div>
				</header>

				<div id='manuscript-blocks-container' class='manuscript-blocks' role='list' aria-label='Drehbuch-Abschnitte'></div>

				<footer class='manuscript-add-bar' role='toolbar' aria-label='Neuen Abschnitt hinzufügen'>
					<span class='add-bar-hint'>Hinzufügen:</span>
					<button type='button' class='add-pill-button' data-append-type='scene_heading'>+ Szene</button>
					<button type='button' class='add-pill-button' data-append-type='action'>+ Handlung</button>
					<button type='button' class='add-pill-button' data-append-type='dialogue'>+ Dialog</button>
					<button type='button' class='add-pill-button' data-append-type='transition'>+ Übergang</button>
				</footer>
			</div>
		</section>
	</main>

	<dialog id='ai-import-dialog' class='clean-modal' aria-labelledby='ai-modal-heading'>
		<div class='modal-box'>
			<div class='modal-top'>
				<h2 id='ai-modal-heading' class='modal-heading'>KI-Text einfügen</h2>
				<button type='button' id='close-ai-modal-button' class='icon-button' aria-label='Schließen'>✕</button>
			</div>

			<p class='modal-hint'>
				Kopiere eine Szene aus ChatGPT, Claude oder Gemini hier hinein. Szenen, Figuren, Regieanweisungen und Dialoge werden automatisch in die richtigen Bausteine zerlegt.
			</p>

			<div class='prompt-helper-banner'>
				<span>Du willst der KI vorher sagen, wie sie schreiben soll?</span>
				<button type='button' id='copy-ai-prompt-button' class='subtle-text-button'>
					Optimale KI-Anweisung kopieren
				</button>
			</div>

			<textarea id='ai-raw-text-input' class='clean-textarea' rows='10' placeholder='INT. BÜRO - TAG&#10;&#10;Der Regen prasselt gegen die Scheibe.&#10;&#10;DAVID&#10;(ruhig)&#10;Wir fangen noch einmal ganz von vorne an.' aria-label='Drehbuchtext aus der KI'></textarea>

			<div class='modal-bottom'>
				<button type='button' id='cancel-ai-modal-button' class='secondary-button'>Abbrechen</button>
				<button type='button' id='confirm-ai-import-button' class='primary-button'>In Drehbuch umwandeln</button>
			</div>
		</div>
	</dialog>

	<datalist id='existing-characters-datalist'></datalist>

	<datalist id='standard-times-datalist'>
		<option value='DAY'></option>
		<option value='NIGHT'></option>
		<option value='CONTINUOUS'></option>
		<option value='LATER'></option>
		<option value='TAG'></option>
		<option value='NACHT'></option>
	</datalist>

	<form id='overleaf-bridge-form' action='https://www.overleaf.com/docs' method='post' target='_blank' class='visually-hidden'>
		<input type='hidden' name='snip_name' id='overleaf-filename-input' value='drehbuch.tex'>
		<textarea name='snip' id='overleaf-latex-input'></textarea>
	</form>

	<div id='toast-container' class='toast-container' role='status' aria-live='polite'></div>

	<script type='module' src='./scripts/interface-controller.js'></script>
</body>
</html>
