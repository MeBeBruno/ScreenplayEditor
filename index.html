<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Screenplay Editor</title>
	<link rel="stylesheet" href="styles.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
	<header>
		<div class="header-info">
			<h1>Screenplay Editor</h1>
		</div>
		<div class="export-actions">
			<button id="export-pdf-btn" class="primary">Skript als PDF exportieren</button>
		</div>
	</header>

	<section id="config-panel" aria-label="Script metadata">
		<div class="input-group">
			<label for="script-title">Title</label>
			<input type="text" id="script-title" placeholder="Forrest Gump..." />
		</div>
		<div class="input-group">
			<label for="script-author">Author</label>
			<input type="text" id="script-author" placeholder="Robert Zemeckis..." />
		</div>
	</section>
	
	<nav id="editor-toolbar" aria-label="Block settings">
		<div class="toolbar-primary">
			<div class="input-group">
				<label for="block-type-selector">Current block</label>
				<select id="block-type-selector">
					<option value="scene_heading">Scene Heading</option>
					<option value="action">Action</option>
					<option value="character">Character</option>
					<option value="parenthetical">Additional dialogue description</option>
					<option value="dialogue">Dialogue</option>
					<option value="transition">Transition</option>
				</select>
			</div>
		</div>
		<div class="toolbar-context" id="context-controls">
		</div>
	</nav>

	<main id="editor-container" aria-label="Editor">
	</main>

	<div id="compiler-overlay" class="fullscreen-overlay hidden">
		<div class="progress-container">
			<div id="progress-bar" class="progress-bar"></div>
		</div>
		<h2 id="compiler-status">Generiere Vektor-PDF...</h2>
	</div>

	<script src="app.js"></script>
</body>
</html>
